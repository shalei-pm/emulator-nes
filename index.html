<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>NES 游戏模拟器</title>
 <script src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>
 <style>
 body { 
 background: linear-gradient(135deg, #1a1a2e, #16213e); 
 color: #fff; 
 font-family: 'Noto Sans SC', sans-serif;
 min-height: 100vh;
 margin: 0;
 padding: 20px;
 }
 
 h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }
 
 .game-container { max-width: 600px; margin: 0 auto; }
 
 .game-selector { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
 
 #nes { 
 background: #000; 
 border: 4px solid #4ecdc4;
 border-radius: 8px;
 width: 512px;
 height: 384px;
 margin: 0 auto;
 display: block;
 image-rendering: pixelated;
 }
 
 .btn {
 background: linear-gradient(135deg, #667eea, #764ba2);
 color: white;
 border: none;
 padding: 12px 20px;
 margin: 5px;
 font-size: 14px;
 cursor: pointer;
 border-radius: 8px;
 }
 .btn:hover { transform: scale(1.05); }
 
 .file-input { display: none; }
 .file-label {
 background: linear-gradient(135deg, #f093fb, #f5576c);
 display: inline-block;
 padding: 12px 20px;
 margin: 5px;
 font-size: 14px;
 border-radius: 8px;
 cursor: pointer;
 }
 
 .game-title { font-size: 20px; margin: 15px 0; color: #ffe66d; text-align: center; }
 
 .controls {
 background: rgba(255,255,255,0.05);
 border: 1px solid rgba(255,255,255,0.1);
 border-radius: 12px;
 padding: 20px;
 max-width: 512px;
 margin: 20px auto;
 }
 .controls h3 { margin: 0 0 15px 0; color: #4ecdc4; font-size: 16px; }
 .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
 .key {
 background: linear-gradient(135deg, #2d3436, #1a1a2e);
 border: 1px solid #4ecdc4;
 border-radius: 6px;
 padding: 5px 10px;
 font-family: monospace;
 font-size: 12px;
 color: #4ecdc4;
 }
 
 #log {
 background: #0f0f23;
 padding: 8px 15px;
 margin-top: 10px;
 font-family: monospace;
 font-size: 11px;
 border-radius: 8px;
 color: #888;
 max-width: 512px;
 margin: 10px auto 0 auto;
 }
 
 @media (max-width: 600px) {
 #nes { width: 100%; height: auto; aspect-ratio: 4/3; }
 }
 </style>
</head>
<body>
 <h1>🎮 NES 游戏模拟器</h1>
 
 <div class="game-container">
 <div class="game-selector">
 <button class="btn" onclick="location.reload()">🔄 重置</button>
 <label class="file-label" for="rom-file">📂 上传ROM</label>
 <input type="file" id="rom-file" class="file-input" accept=".nes,.NES">
 </div>
 
 <div class="game-title" id="gameTitle">上传ROM文件开始游戏</div>
 
 <div id="nes"></div>
 
 <div id="log"></div>
 
 <div class="controls">
 <h3>🎮 操作说明</h3>
 <div class="control-grid">
 <div><span class="key">↑↓←→</span> 方向键</div>
 <div><span class="key">Z</span> A按钮</div>
 <div><span class="key">X</span> B按钮</div>
 <div><span class="key">Enter</span> 开始</div>
 <div><span class="key">Space</span> 暂停</div>
 </div>
 </div>
 </div>

 <script>
 var nes = null;
 var animationId = null;

 function log(msg) {
 document.getElementById('log').innerHTML = msg;
 console.log(msg);
 }

 function destroyOldGame() {
 if (nes) {
 try { nes = null; } catch(e) {}
 }
 if (animationId) {
 cancelAnimationFrame(animationId);
 animationId = null;
 }
 document.getElementById('nes').innerHTML = '';
 }

 function runGame() {
 if (!nes) return;
 
 try {
 nes.frame();
 } catch(e) {}
 
 animationId = requestAnimationFrame(runGame);
 }

 function loadROM(romData) {
 try {
 destroyOldGame();
 log('加载ROM: ' + romData.length + ' bytes');
 
 nes = new jsnes.NES({
 onFrame: function(frameBuffer) {
 var canvas = document.querySelector('#nes canvas');
 if (!canvas) {
 canvas = document.createElement('canvas');
 canvas.width = 256;
 canvas.height = 240;
 document.getElementById('nes').appendChild(canvas);
 }
 var ctx = canvas.getContext('2d');
 var imageData = ctx.createImageData(256, 240);
 for (var i = 0; i < frameBuffer.length; i++) {
 var p = frameBuffer[i];
 imageData.data[i*4] = (p >> 16) & 0xFF;
 imageData.data[i*4+1] = (p >> 8) & 0xFF;
 imageData.data[i*4+2] = p & 0xFF;
 imageData.data[i*4+3] = 255;
 }
 ctx.putImageData(imageData, 0, 0);
 },
 onStatusUpdate: function(s) { log('状态: ' + s); }
 });

 nes.loadROM(romData);
 runGame();
 log('游戏运行中！按方向键选择，Enter开始');
 document.getElementById('gameTitle').textContent = '游戏运行中';
 } catch (err) {
 log('错误: ' + err.message);
 console.error(err);
 }
 }

 // 键盘控制
 document.addEventListener('keydown', function(e) {
 if (!nes) return;
 
 var key = e.key.toLowerCase();
 var btn = null;
 
 if (key === 'arrowup') btn = jsnes.Controller.BUTTON_UP;
 else if (key === 'arrowdown') btn = jsnes.Controller.BUTTON_DOWN;
 else if (key === 'arrowleft') btn = jsnes.Controller.BUTTON_LEFT;
 else if (key === 'arrowright') btn = jsnes.Controller.BUTTON_RIGHT;
 else if (key === 'z') btn = jsnes.Controller.BUTTON_A;
 else if (key === 'x') btn = jsnes.Controller.BUTTON_B;
 else if (key === 'enter') btn = jsnes.Controller.BUTTON_START;
 else if (key === 'shift') btn = jsnes.Controller.BUTTON_SELECT;
 else if (key === ' ') { e.preventDefault(); return; }
 
 if (btn !== null) {
 nes.controller[1][btn] = true;
 e.preventDefault();
 }
 });

 document.addEventListener('keyup', function(e) {
 if (!nes) return;
 
 var key = e.key.toLowerCase();
 var btn = null;
 
 if (key === 'arrowup') btn = jsnes.Controller.BUTTON_UP;
 else if (key === 'arrowdown') btn = jsnes.Controller.BUTTON_DOWN;
 else if (key === 'arrowleft') btn = jsnes.Controller.BUTTON_LEFT;
 else if (key === 'arrowright') btn = jsnes.Controller.BUTTON_RIGHT;
 else if (key === 'z') btn = jsnes.Controller.BUTTON_A;
 else if (key === 'x') btn = jsnes.Controller.BUTTON_B;
 else if (key === 'enter') btn = jsnes.Controller.BUTTON_START;
 else if (key === 'shift') btn = jsnes.Controller.BUTTON_SELECT;
 
 if (btn !== null) {
 nes.controller[1][btn] = false;
 }
 });

 // 文件上传
 document.getElementById('rom-file').addEventListener('change', function(e) {
 var file = e.target.files[0];
 if (!file) return;
 log('读取: ' + file.name);
 var reader = new FileReader();
 reader.onload = function(ev) {
 loadROM(new Uint8Array(ev.target.result));
 };
 reader.readAsArrayBuffer(file);
 });

 log('jsNES v2 已加载，上传ROM开始游戏');
 </script>
</body>
</html>
