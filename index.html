<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版NES模拟器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #fff; }
        h1 { margin-bottom: 20px; color: #4ade80; font-size: 24px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button, input[type="file"] { padding: 10px 20px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; background: #3b3b5c; color: #fff; }
        button:hover:not(:disabled) { background: #4ade80; color: #1a1a2e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #game-container { background: #000; border: 4px solid #4ade80; border-radius: 8px; line-height: 0; box-shadow: 0 0 30px rgba(74, 222, 128, 0.3); }
        #game-container canvas { display: block; max-width: 100%; image-rendering: pixelated; }
        .status { margin-top: 15px; padding: 12px 24px; background: rgba(59, 59, 92, 0.8); border-radius: 8px; text-align: center; font-size: 14px; }
        .tips { margin-top: 20px; padding: 20px; background: rgba(42, 42, 74, 0.8); border-radius: 8px; max-width: 512px; font-size: 13px; line-height: 1.8; }
        .tips h3 { color: #4ade80; margin-bottom: 12px; }
        .tips kbd { background: #4a4a6a; padding: 2px 8px; border-radius: 4px; font-family: monospace; }
        .file-input-wrapper { position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎮 网页版NES模拟器</h1>
    <div class="controls">
        <button id="start-demo-btn">🎮 试玩Demo ROM</button>
        <div class="file-input-wrapper">
            <button>📂 加载本地ROM</button>
            <input type="file" id="rom-file" accept=".nes,.NES">
        </div>
        <button id="reset-btn" disabled>🔄 重置</button>
        <button id="pause-btn" disabled>⏸️ 暂停</button>
    </div>
    <div id="game-container"><canvas id="screen" width="512" height="480"></canvas></div>
    <div class="status" id="status">点击"试玩Demo ROM"开始游戏</div>
    <div class="tips">
        <h3>🎮 操作说明</h3>
        <p><kbd>↑↓←→</kbd> 方向键移动</p>
        <p><kbd>Z</kbd> / <kbd>A</kbd> A按钮</p>
        <p><kbd>X</kbd> / <kbd>S</kbd> B按钮</p>
        <p><kbd>Enter</kbd> 开始</p>
        <p><kbd>Shift</kbd> 选择</p>
    </div>

        function init() {
            statusEl.textContent = '点击"试玩Demo ROM"开始游戏，或加载本地ROM文件';
        }
        
        function startGame(romData) {
            try {
                if (nes) { cancelAnimationFrame(animationFrame); nes = null; }
                nes = new jsnes.NES({
                    onFrame: function(frameBuffer) {
                        const imageData = ctx.createImageData(NES_WIDTH, NES_HEIGHT);
                        for (let i = 0; i < frameBuffer.length; i++) {
                            const p = frameBuffer[i];
                            imageData.data[i*4] = (p>>16)&0xFF;
                            imageData.data[i*4+1] = (p>>8)&0xFF;
                            imageData.data[i*4+2] = p&0xFF;
                            imageData.data[i*4+3] = 255;
                        }
                        ctx.putImageData(imageData, 0, 0);
                    }
                });
                nes.loadROM(romData);
                isRunning = true; isPaused = false;
                resetBtn.disabled = false; pauseBtn.disabled = false; startDemoBtn.disabled = true;
                loop();
                statusEl.textContent = '🎮 游戏运行中 - 按Z/X键操作';
            } catch (e) {
                statusEl.textContent = '❌ 错误: ' + e.message;
                console.error(e);
            }
        }
        
        function loop() { if (!isRunning || isPaused) return; nes.frame(); animationFrame = requestAnimationFrame(loop); }
        
        const keyMap = {
            'ArrowUp':jsnes.Controller.BUTTON_UP,'ArrowDown':jsnes.Controller.BUTTON_DOWN,
            'ArrowLeft':jsnes.Controller.BUTTON_LEFT,'ArrowRight':jsnes.Controller.BUTTON_RIGHT,
            'z':jsnes.Controller.BUTTON_A,'Z':jsnes.Controller.BUTTON_A,
            'x':jsnes.Controller.BUTTON_B,'X':jsnes.Controller.BUTTON_B,
            'a':jsnes.Controller.BUTTON_A,'A':jsnes.Controller.BUTTON_A,
            's':jsnes.Controller.BUTTON_B,'S':jsnes.Controller.BUTTON_B,
            'Enter':jsnes.Controller.BUTTON_START,'Shift':jsnes.Controller.BUTTON_SELECT
        };
        
        document.addEventListener('keydown', e => { if(nes&&keyMap[e.key]!==undefined){ nes.controller[1][keyMap[e.key]]=true; e.preventDefault(); }});
        document.addEventListener('keyup', e => { if(nes&&keyMap[e.key]!==undefined) nes.controller[1][keyMap[e.key]]=false; });
        
        startDemoBtn.addEventListener('click', function() {
            statusEl.textContent = '📥 加载Demo ROM...';
            try {
                const romData = Uint8Array.from(atob(demoROM), c => c.charCodeAt(0));
                startGame(romData);
            } catch(e) { statusEl.textContent = '❌ 加载失败: ' + e.message; }
        });
        
        romFileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if(!file) return;
            statusEl.textContent = '📖 读取ROM...';
            const reader = new FileReader();
            reader.onload = ev => startGame(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        });
        
        resetBtn.addEventListener('click', () => { if(nes){ nes.reset(); statusEl.textContent='🔄 已重置'; }});
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶️ 继续' : '⏸️ 暂停';
            statusEl.textContent = isPaused ? '⏸️ 已暂停' : '▶️ 继续';
            if(!isPaused) loop();
        });
        
        init();
    </script>
</body>
</html>
