<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>NES 游戏模拟器 v5.1</title>
 <script src="https://unpkg.com/jsnes@1/dist/jsnes.min.js"></script>
 <style>
 body { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; margin: 0; padding: 20px; }
 h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }
 .game-container { max-width: 600px; margin: 0 auto; }
 .game-selector { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
 #game-container { background: #000; border: 4px solid #4ecdc4; border-radius: 8px; width: 512px; height: 480px; margin: 0 auto; position: relative; }
 .btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 20px; margin: 5px; font-size: 14px; cursor: pointer; border-radius: 8px; }
 .btn:hover { transform: scale(1.05); }
 .file-input { display: none; }
 .file-label { background: linear-gradient(135deg, #f093fb, #f5576c); display: inline-block; padding: 12px 20px; margin: 5px; font-size: 14px; border-radius: 8px; cursor: pointer; }
 .game-title { font-size: 20px; margin: 15px 0; color: #ffe66d; text-align: center; }
 .controls { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; max-width: 512px; margin: 20px auto; }
 .controls h3 { margin: 0 0 15px 0; color: #4ecdc4; font-size: 16px; }
 .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
 .key { background: linear-gradient(135deg, #2d3436, #1a1a2e); border: 1px solid #4ecdc4; border-radius: 6px; padding: 5px 10px; font-family: monospace; font-size: 12px; color: #4ecdc4; }
 .turbo { color: #ffe66d; font-size: 12px; margin-top: 10px; text-align: center; }
 #log { background: #0f0f23; padding: 8px 15px; margin-top: 10px; font-family: monospace; font-size: 11px; border-radius: 8px; color: #0f0; max-width: 512px; margin: 10px auto 0 auto; height: 60px; overflow-y: auto; white-space: pre-wrap; }
 @media (max-width: 600px) { #game-container { width: 100%; height: auto; aspect-ratio: 4/3; } }
 </style>
</head>
<body>
 <h1>🎮 NES 游戏模拟器 v5.1</h1>
 <div class="game-container">
 <div class="game-selector">
 <button class="btn" onclick="location.reload()">🔄 重置</button>
 <label class="file-label" for="rom-file">📂 上传ROM</label>
 <input type="file" id="rom-file" class="file-input" accept=".nes,.NES">
 </div>
 <div class="game-title" id="gameTitle">上传ROM文件开始游戏</div>
 <div id="game-container"></div>
 <div id="log"></div>
 <div class="controls">
 <h3>🎮 操作说明</h3>
 <div class="control-grid">
 <div><span class="key">W/S/A/D</span> 上下左右</div>
 <div><span class="key">G</span> A</div>
 <div><span class="key">H</span> B</div>
 <div><span class="key">1</span> 开始</div>
 <div><span class="key">2</span> Select</div>
 </div>
 </div>
 </div>

 <script>
 var nes = null;
 var canvas = null;
 var ctx = null;
 var logLines = [];
 var holdingKeys = {}; // 记录按住的键

 function log(msg) { 
  logLines.push(msg);
  if (logLines.length > 20) logLines.shift();
  document.getElementById('log').textContent = logLines.join('\n');
 }

 function initCanvas() {
  canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 240;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  document.getElementById('game-container').innerHTML = '';
  document.getElementById('game-container').appendChild(canvas);
  ctx = canvas.getContext('2d');
 }

 var frameCount = 0;
 function gameLoop() {
  if (nes) {
   // 检测连发：每5帧触发一次按住状态
   if (frameCount % 5 === 0) {
    if (holdingKeys['g']) nes.buttonDown(1, 'A');
    if (holdingKeys['h']) nes.buttonDown(1, 'B');
   }
   
   nes.frame();
   frameCount++;
  }
  requestAnimationFrame(gameLoop);
 }

 function loadROM(romData) {
  try {
   log('加载ROM: ' + romData.length + ' bytes');
   initCanvas();
   
   nes = new jsnes.NES({
    onFrame: function(buffer) {
     if (!ctx) return;
     var imageData = ctx.createImageData(256, 240);
     for (var i = 0; i < buffer.length; i++) {
      var pixel = buffer[i];
      imageData.data[i * 4 + 0] = (pixel >> 0) & 0xFF;
      imageData.data[i * 4 + 1] = (pixel >> 8) & 0xFF;
      imageData.data[i * 4 + 2] = (pixel >> 16) & 0xFF;
      imageData.data[i * 4 + 3] = 0xFF;
     }
     ctx.putImageData(imageData, 0, 0);
    },
    onAudioSample: function(sample) {}
   });

   nes.loadROM(romData);
   log('加载成功!');
   
   gameLoop();
   log('游戏开始！');
  } catch (err) { 
   log('错误: ' + err.message); 
  }
 }

 var keyMap = {
  'g': 'A', 'h': 'B', '2': 'SELECT', '1': 'START',
  'w': 'UP', 's': 'DOWN', 'a': 'LEFT', 'd': 'RIGHT'
 };

 document.addEventListener('keydown', function(e) {
  if (!nes) return;
  var key = e.key.toLowerCase();
  var btn = keyMap[key];
  if (btn) {
   if (nes.controllers[1].state) {
    nes.controllers[1].state[jsnes.Controller['BUTTON_' + btn]] = true;
   } else {
    nes.buttonDown(1, btn);
   }
   holdingKeys[key] = true;
   e.preventDefault();
  }
 });

 document.addEventListener('keyup', function(e) {
  if (!nes) return;
  var key = e.key.toLowerCase();
  var btn = keyMap[key];
  if (btn) {
   if (nes.controllers[1].state) {
    nes.controllers[1].state[jsnes.Controller['BUTTON_' + btn]] = false;
   } else {
    nes.buttonUp(1, btn);
   }
   holdingKeys[key] = false;
  }
 });

 document.getElementById('rom-file').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  log('读取: ' + file.name);
  var reader = new FileReader();
  reader.onload = function(ev) { loadROM(ev.target.result); };
  reader.readAsBinaryString(file);
 });

 log('jsNES v5.1 - 上传ROM开始');
 </script>
</body>
</html>
