<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版NES模拟器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px; 
            color: #fff; 
        }
        h1 { margin-bottom: 30px; color: #4ade80; font-size: 28px; }
        
        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
        }
        
        .card h2 { margin-bottom: 20px; font-size: 20px; }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            background: #4ade80;
            color: #1a1a2e;
            font-weight: bold;
        }
        
        .btn:hover { transform: scale(1.05); }
        
        .tips { margin-top: 30px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h1>🎮 NES模拟器</h1>
    
    <div class="card">
        <h2>选择入口</h2>
        
        <a href="https://emulatorjs.org/nes" target="_blank" class="btn">
            🌐 在线模拟器
        </a>
        
        <a href="upload.html" class="btn">
            📂 上传ROM
        </a>
        
        <div class="tips">
            <p>点击"在线模拟器"可直接游玩</p>
        </div>
    </div>
</body>
</html>
