<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>NES 游戏模拟器 v3.3</title>
 <script src="https://unpkg.com/jsnes@1/dist/jsnes.min.js"></script>
 <style>
 body { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; margin: 0; padding: 20px; }
 h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }
 .game-container { max-width: 600px; margin: 0 auto; }
 .game-selector { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
 #nes { background: #000; border: 4px solid #4ecdc4; border-radius: 8px; width: 512px; height: 480px; margin: 0 auto; display: block; }
 .btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 20px; margin: 5px; font-size: 14px; cursor: pointer; border-radius: 8px; }
 .btn:hover { transform: scale(1.05); }
 .file-input { display: none; }
 .file-label { background: linear-gradient(135deg, #f093fb, #f5576c); display: inline-block; padding: 12px 20px; margin: 5px; font-size: 14px; border-radius: 8px; cursor: pointer; }
 .game-title { font-size: 20px; margin: 15px 0; color: #ffe66d; text-align: center; }
 .controls { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; max-width: 512px; margin: 20px auto; }
 .controls h3 { margin: 0 0 15px 0; color: #4ecdc4; font-size: 16px; }
 .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
 .key { background: linear-gradient(135deg, #2d3436, #1a1a2e); border: 1px solid #4ecdc4; border-radius: 6px; padding: 5px 10px; font-family: monospace; font-size: 12px; color: #4ecdc4; }
 #log { background: #0f0f23; padding: 8px 15px; margin-top: 10px; font-family: monospace; font-size: 11px; border-radius: 8px; color: #888; max-width: 512px; margin: 10px auto 0 auto; }
 @media (max-width: 600px) { #nes { width: 100%; height: auto; aspect-ratio: 4/3; } }
 </style>
</head>
<body>
 <h1>🎮 NES 游戏模拟器 v3.3</h1>
 <div class="game-container">
 <div class="game-selector">
 <button class="btn" onclick="location.reload()">🔄 重置</button>
 <label class="file-label" for="rom-file">📂 上传ROM</label>
 <input type="file" id="rom-file" class="file-input" accept=".nes,.NES">
 </div>
 <div class="game-title" id="gameTitle">上传ROM文件开始游戏</div>
 <div id="nes"></div>
 <div id="log"></div>
 <div class="controls">
 <h3>🎮 操作说明</h3>
 <div class="control-grid">
 <div><span class="key">W/S/A/D</span> 上下左右</div>
 <div><span class="key">G</span> A按钮</div>
 <div><span class="key">H</span> B按钮</div>
 <div><span class="key">1</span> 开始</div>
 <div><span class="key">2</span> Select选择</div>
 </div>
 </div>
 </div>

 <script>
 var nes = null;
 var timerId = null;

 function log(msg) { document.getElementById('log').innerHTML = msg; console.log('[NES]', msg); }

 function destroyOldGame() {
 if (nes) { try { nes.stop(); } catch(e) {} nes = null; }
 if (timerId) { clearInterval(timerId); timerId = null; }
 document.getElementById('nes').innerHTML = '';
 }

 function runFrame() {
 if (!nes || !nes.isRunning) return;
 nes.frame();
 }

 function loadROM(buffer) {
 try {
  destroyOldGame();
  
  var header = new Uint8Array(buffer, 0, 16);
  var headerHex = Array.from(header).map(b => b.toString(16).padStart(2, '0')).join(' ');
  var isValid = (header[0] === 0x4E && header[1] === 0x45 && header[2] === 0x53 && header[3] === 0x1A);
  log('ROM: ' + headerHex + (isValid ? ' ✓' : ' ✗'));
  
  nes = new jsnes.NES({
   width: 512,
   height: 480,
   container: document.getElementById('nes')
  });

  var uint8 = new Uint8Array(buffer);
  var binary = '';
  for (var i = 0; i < uint8.length; i++) {
   binary += String.fromCharCode(uint8[i]);
  }
  
  nes.loadROM(binary);
  
  // 尝试启动
  console.log('nes.start:', typeof nes.start);
  if (typeof nes.start === 'function') {
   nes.start();
  }
  
  console.log('isRunning:', nes.isRunning);
  console.log('controller:', nes.controller);
  
  timerId = setInterval(runFrame, 1000 / 60);
  
  log('运行中！按G测试');
  document.getElementById('gameTitle').textContent = '游戏中 - 按G测试';
 } catch (err) { log('错误: ' + err.message); console.error(err); }
 }

 // 键盘 - buttonState 数组
 document.addEventListener('keydown', function(e) {
 if (!nes || !nes.isRunning) return;
 
 var key = e.key.toLowerCase();
 var idx = null;
 if (key === 'g') idx = 0;
 else if (key === 'h') idx = 1;
 else if (key === '2') idx = 2;
 else if (key === '1') idx = 3;
 else if (key === 'w') idx = 4;
 else if (key === 's') idx = 5;
 else if (key === 'a') idx = 6;
 else if (key === 'd') idx = 7;
 
 if (idx !== null) {
  nes.controller[1].buttonState[idx] = true;
  e.preventDefault();
  console.log('按下:', key, 'idx=', idx, 'state=', nes.controller[1].buttonState);
 }
 });

 document.addEventListener('keyup', function(e) {
 if (!nes || !nes.isRunning) return;
 var key = e.key.toLowerCase();
 var idx = null;
 if (key === 'g') idx = 0;
 else if (key === 'h') idx = 1;
 else if (key === '2') idx = 2;
 else if (key === '1') idx = 3;
 else if (key === 'w') idx = 4;
 else if (key === 's') idx = 5;
 else if (key === 'a') idx = 6;
 else if (key === 'd') idx = 7;
 if (idx !== null) nes.controller[1].buttonState[idx] = false;
 });

 document.getElementById('rom-file').addEventListener('change', function(e) {
 var file = e.target.files[0];
 if (!file) return;
 log('读取: ' + file.name);
 var reader = new FileReader();
 reader.onload = function(ev) { loadROM(ev.target.result); };
 reader.readAsArrayBuffer(file);
 });

 log('jsNES v1 - 上传ROM开始');
 </script>
</body>
</html>
