<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>NES 游戏模拟器</title>
 <script src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>
 <style>
 body { 
 background: linear-gradient(135deg, #1a1a2e, #16213e); 
 color: #fff; 
 font-family: 'Noto Sans SC', sans-serif;
 min-height: 100vh;
 margin: 0;
 padding: 20px;
 }
 
 h1 {
 text-align: center;
 margin-bottom: 20px;
 font-size: 28px;
 }
 
 .game-container {
 max-width: 600px;
 margin: 0 auto;
 }
 
 .game-selector { 
 text-align: center; 
 margin-bottom: 15px; 
 display: flex;
 flex-wrap: wrap;
 justify-content: center;
 gap: 10px;
 }
 
 #nes { 
 background: #000; 
 border: 4px solid #4ecdc4;
 border-radius: 8px;
 width: 512px;
 height: 480px;
 margin: 0 auto;
 display: block;
 }
 
 .btn {
 background: linear-gradient(135deg, #667eea, #764ba2);
 color: white;
 border: none;
 padding: 12px 20px;
 margin: 5px;
 font-size: 14px;
 cursor: pointer;
 border-radius: 8px;
 transition: transform 0.2s;
 }
 .btn:hover { transform: scale(1.05); }
 .btn.active { 
 background: linear-gradient(135deg, #4ecdc4, #44a08d); 
 box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
 }
 
 .file-input {
 display: none;
 }
 
 .file-label {
 background: linear-gradient(135deg, #f093fb, #f5576c);
 display: inline-block;
 padding: 12px 20px;
 margin: 5px;
 font-size: 14px;
 border-radius: 8px;
 cursor: pointer;
 }
 .file-label:hover { transform: scale(1.05); }
 
 .game-title { 
 font-size: 20px; 
 margin: 15px 0;
 color: #ffe66d;
 text-align: center;
 }
 
 #log {
 background: #0f0f23;
 padding: 8px 15px;
 margin-top: 10px;
 font-family: monospace;
 font-size: 11px;
 border-radius: 8px;
 max-height: 60px;
 overflow-y: auto;
 color: #888;
 max-width: 512px;
 margin: 10px auto 0 auto;
 }
 
 @media (max-width: 600px) {
 #nes {
 width: 100%;
 height: auto;
 aspect-ratio: 512/480;
 }
 }
 </style>
</head>
<body>
 <h1>🎮 NES 游戏模拟器</h1>
 
 <div class="game-container">
 <div class="game-selector">
 <button class="btn" onclick="resetGame()">🔄 重置</button>
 <label class="file-label" for="rom-file">📂 上传ROM</label>
 <input type="file" id="rom-file" class="file-input" accept=".nes,.NES">
 </div>
 
 <div class="game-title" id="gameTitle">上传ROM文件开始游戏</div>
 
 <div id="nes"></div>
 
 <div id="log"></div>
 </div>

 <script>
 var browser = null;

 function log(msg) {
 var div = document.getElementById('log');
 div.innerHTML = msg + ' ';
 div.scrollTop = div.scrollHeight;
 console.log(msg);
 }

 function destroyOldGame() {
 if (browser) {
 try { browser.destroy(); } catch(e) {}
 browser = null;
 }
 document.getElementById('nes').innerHTML = '';
 }

 function resetGame() {
 destroyOldGame();
 log('已重置，请上传ROM');
 }

 function loadROM(romData) {
 try {
 destroyOldGame();
 log('加载ROM: ' + romData.length + ' bytes');
 
 browser = new jsnes.Browser({
 container: document.getElementById('nes'),
 onError: function(e) { log('错误: ' + e); },
 onStatusUpdate: function(s) { log('状态: ' + s); }
 });

 browser.loadROM(romData);
 log('游戏启动成功!');
 document.getElementById('gameTitle').textContent = '游戏运行中 - 按键操作';
 } catch (err) {
 log('错误: ' + err.message);
 console.error(err);
 }
 }

 // 文件上传处理
 document.getElementById('rom-file').addEventListener('change', function(e) {
 var file = e.target.files[0];
 if (!file) return;
 
 log('读取文件: ' + file.name);
 
 var reader = new FileReader();
 reader.onload = function(ev) {
 var romData = new Uint8Array(ev.target.result);
 loadROM(romData);
 };
 reader.readAsArrayBuffer(file);
 });

 log('jsNES v2 已加载，请上传ROM文件');
 </script>
</body>
</html>
